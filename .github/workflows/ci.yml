# CI (plan Task T8). Three jobs, no secrets, no AWS credentials anywhere:
#   terraform — fmt/init(-backend=false)/validate/test with mock providers, plus
#               tflint using only its bundled ruleset (no AWS plugin, so it runs
#               offline and needs no credentials).
#   pwsh      — Pester unit tests and PSScriptAnalyzer in the same PowerShell
#               container used for local test runs.
#   shell     — POSIX contract tests for tf-init.sh and the audit self-test.
#
# tests/windows is deliberately NOT executed here: those tests are machine-tier
# (they need the enrolled Windows 11 host) and run on-machine in V4.

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  terraform:
    name: terraform fmt / init / validate / test + tflint
    runs-on: ubuntu-latest
    env:
      TFLINT_VERSION: "0.64.0"
    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "~1.14.0"
          terraform_wrapper: false

      - name: Install tflint
        run: |
          curl -sSfL "https://github.com/terraform-linters/tflint/releases/download/v${TFLINT_VERSION}/tflint_linux_amd64.zip" -o /tmp/tflint.zip
          unzip -o /tmp/tflint.zip -d "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # No .tflint.hcl exists and none may declare plugins: --init is a no-op and
      # tflint must stay on its bundled ruleset only (no AWS plugin, no network,
      # no credentials).
      - name: tflint (bundled ruleset only, no plugins)
        run: |
          tflint --version
          tflint --init
          tflint --chdir=terraform/bootstrap --recursive
          tflint --chdir=terraform/infrastructure --recursive

      - name: terraform fmt -check
        run: |
          terraform -chdir=terraform/bootstrap fmt -check -recursive
          terraform -chdir=terraform/infrastructure fmt -check -recursive

      - name: terraform init -backend=false + validate
        run: |
          for stack in bootstrap infrastructure; do
            terraform -chdir="terraform/$stack" init -backend=false -input=false
            terraform -chdir="terraform/$stack" validate
          done

      # *.tftest.hcl uses mock_provider "aws" {}; state is in-memory, the backend
      # is ignored, and no AWS credentials are needed or wanted here.
      - name: terraform test (mock providers, no AWS credentials)
        run: |
          terraform -chdir=terraform/bootstrap test
          terraform -chdir=terraform/infrastructure test

  pwsh:
    name: Pester unit tests + PSScriptAnalyzer
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/powershell:7.4-ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - name: Install Pester + PSScriptAnalyzer
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          # MaximumVersion keeps us on the Pester 5 line the tests target;
          # MinimumVersion 5.5 alone now resolves to the Pester 6 major rewrite.
          Install-Module Pester -MinimumVersion 5.5 -MaximumVersion 5.99 -Scope CurrentUser -Force
          Install-Module PSScriptAnalyzer -Scope CurrentUser -Force

      - name: Pester unit tests (tests/unit)
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $config = New-PesterConfiguration
          $config.Run.Path = './tests/unit'
          $config.Run.Exit = $true  # exit code = failed test count, so a red suite fails the step
          $config.Output.Verbosity = 'Detailed'
          Invoke-Pester -Configuration $config

      - name: PSScriptAnalyzer (scripts/windows)
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $findings = Invoke-ScriptAnalyzer -Path ./scripts/windows -Recurse -Settings ./.PSScriptAnalyzerSettings.psd1
          if ($findings) {
            $findings | Format-Table -AutoSize RuleName, Severity, ScriptName, Line, Message | Out-String | Write-Host
            exit 1
          }

      # Machine-tier Windows tests are never run in CI; parse-check them only so
      # a syntax error cannot hide until V4. Skipped entirely until they exist.
      - name: Parse-check tests/windows (not executed in CI)
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          if (-not (Test-Path ./tests/windows)) {
            Write-Host 'tests/windows does not exist yet; nothing to parse-check'
            exit 0
          }
          $errors = foreach ($file in Get-ChildItem ./tests/windows -Filter '*.Tests.ps1' -Recurse) {
            $tokens = $null
            $parseErrors = $null
            $null = [System.Management.Automation.Language.Parser]::ParseFile($file.FullName, [ref]$tokens, [ref]$parseErrors)
            $parseErrors
          }
          if ($errors) {
            $errors | ForEach-Object { Write-Host "PARSE ERROR: $($_.Message)" }
            exit 1
          }

  shell:
    name: POSIX tests + repo audit
    runs-on: ubuntu-latest
    steps:
      # Full history: audit.sh scans `git log -p --all`, which a shallow clone
      # would silently truncate.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: tf-init contract tests
        run: sh tests/tf-init.test.sh

      - name: audit selftest
        run: scripts/audit.sh --selftest

      # Default mode scans tracked files and the full git history for secrets
      # and identifying values. Re-enabled once the synthetic-literal
      # suppression marker landed; it must stay passing.
      - name: audit (default mode)
        run: scripts/audit.sh

      - name: shellcheck
        run: shellcheck scripts/tf-init.sh scripts/audit.sh
